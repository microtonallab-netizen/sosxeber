<article class="card">
  {% if a.image %}<a class="pic" href="{{ a.url }}" tabindex="-1" aria-hidden="true"><img src="{{ a.image }}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></a>{% endif %}
  <a class="cat" href="/kateqoriya/{{ a.cat_slug }}/">{{ a.category }}</a>
  <h2><a href="{{ a.url }}">{{ a.title }}</a></h2>
  <time datetime="{{ a.published }}">{{ a.published | date_az }}</time>
</article>
